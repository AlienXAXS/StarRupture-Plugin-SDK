# Reusable release workflow for StarRupture plugins.
#
# Usage - in your plugin repo's .github/workflows/release.yml (see templates/release.yml):
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: AlienXAXS/StarRupture-Plugin-SDK/.github/workflows/plugin-release.yml@<SDK release tag>
#       with:
#         plugin_name: Compass_Plugin
#         solution_file: Compass_Plugin.sln
#       secrets: inherit
#
# Inputs:
#   plugin_name            - Base name used for the manifest, ZIP and release assets.
#   solution_file          - Path to the .sln file relative to the repo root.
#   dll_name               - Name of the built DLL, when it differs from plugin_name.
#   server_build           - true to also build, package and release the Server variant
#                            (default false: Client only).
#   release_title          - Optional release title prefix (defaults to plugin_name).
#   nexus_mod_id           - Global (v3 API) id of the Nexus page. Empty (default) skips Nexus.
#                            The Client upload sets the page Version field, changelog and
#                            description; the Server upload (server_build) only adds the file.
#   nexus_display_name     - Name shown on the Nexus files (defaults to plugin_name).
#   nexus_description_file - BBCode file that replaces the Nexus page description when it exists
#                            (default nexus/description.bbcode).
#   sdk_repository, sdk_ref - Where to take the Plugin SDK headers from (default: the default
#                            branch of AlienXAXS/StarRupture-Plugin-SDK).
#   dry_run                - Build and package, upload the files as a workflow artifact, but
#                            create no GitHub release and upload nothing to Nexus.
#
# Release notes: UPDATE_NOTES.txt at the repo root, one change per line, is shown above the
# generated notes on the release page, stored as "notes" in the update manifest, and is the
# Nexus changelog entry. A missing or empty file means the entry links to the release.
#
# Secrets (via "secrets: inherit", only when nexus_mod_id is set): NEXUS_APIKEY,
# NEXUS_CLIENT_GROUP_ID and, with server_build, NEXUS_SERVER_GROUP_ID.

name: Plugin Release (reusable)

on:
  workflow_call:
    inputs:
      plugin_name:
        description: 'Base plugin name (e.g. Compass_Plugin)'
        required: true
        type: string
      solution_file:
        description: 'Path to the .sln file relative to the repo root'
        required: true
        type: string
      dll_name:
        description: 'Built DLL name when it differs from plugin_name'
        required: false
        type: string
        default: ''
      server_build:
        description: 'Also build, package and release the Server variant'
        required: false
        type: boolean
        default: false
      release_title:
        description: 'Release title prefix (defaults to plugin_name)'
        required: false
        type: string
        default: ''
      nexus_mod_id:
        description: 'Global (v3 API) id of the Nexus page; empty skips the Nexus upload'
        required: false
        type: string
        default: ''
      nexus_display_name:
        description: 'Name shown on the Nexus files (defaults to plugin_name)'
        required: false
        type: string
        default: ''
      nexus_description_file:
        description: 'BBCode file that replaces the Nexus page description, if it exists'
        required: false
        type: string
        default: 'nexus/description.bbcode'
      sdk_repository:
        description: 'Repository to take the Plugin SDK headers from'
        required: false
        type: string
        default: 'AlienXAXS/StarRupture-Plugin-SDK'
      sdk_ref:
        description: 'Branch, tag or sha of the Plugin SDK (empty: default branch)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and package only: no GitHub release, no Nexus upload'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      - name: Checkout Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sdk_repository }}
          ref: ${{ inputs.sdk_ref }}
          path: plugin-sdk

      - name: Checkout Game SDK
        uses: actions/checkout@v4
        with:
          repository: AlienXAXS/StarRupture-Game-SDK
          path: game-sdk

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Parse-Semver([string]$v) {
            if ($v -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              return @{
                Major = [int]$Matches[1]
                Minor = [int]$Matches[2]
                Patch = [int]$Matches[3]
              }
            }
            return $null
          }

          function Compare-Semver($a, $b) {
            if ($a.Major -lt $b.Major) { return -1 }
            if ($a.Major -gt $b.Major) { return  1 }
            if ($a.Minor -lt $b.Minor) { return -1 }
            if ($a.Minor -gt $b.Minor) { return  1 }
            if ($a.Patch -lt $b.Patch) { return -1 }
            if ($a.Patch -gt $b.Patch) { return  1 }
            return 0
          }

          function Format-Semver($v) {
            return "v$($v.Major).$($v.Minor).$($v.Patch)"
          }

          # Find the highest existing semver release tag
          $latestParsed = $null
          $releaseTags = gh release list --limit 100 --json tagName |
            ConvertFrom-Json |
            Select-Object -ExpandProperty tagName |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }

          foreach ($t in $releaseTags) {
            $parsed = Parse-Semver $t
            if ($parsed -and ($latestParsed -eq $null -or (Compare-Semver $parsed $latestParsed) -gt 0)) {
              $latestParsed = $parsed
            }
          }

          if ($latestParsed -eq $null) {
            Write-Host "No semver tags found, bootstrapping from v0.0.0"
            $latestParsed = @{ Major = 0; Minor = 0; Patch = 0 }
          } else {
            Write-Host "Latest semver tag: $(Format-Semver $latestParsed)"
          }

          # Auto-increment: bump minor, reset patch
          $autoParsed = @{
            Major = $latestParsed.Major
            Minor = $latestParsed.Minor + 1
            Patch = 0
          }

          # Optional version file override (must be strictly higher to win)
          $versionFile = Join-Path $env:GITHUB_WORKSPACE "version"
          $fileParsed = $null

          if (Test-Path $versionFile) {
            $raw = (Get-Content $versionFile -Raw).Trim()
            $fileParsed = Parse-Semver $raw
            if ($fileParsed) {
              Write-Host "version file specifies: $raw"
            } else {
              Write-Warning "version file '$raw' is not valid semver, ignoring."
            }
          }

          $chosen = $autoParsed
          if ($fileParsed -and (Compare-Semver $fileParsed $autoParsed) -gt 0) {
            $chosen = $fileParsed
            Write-Host "version file is higher, using it."
          } else {
            Write-Host "Auto-increment minor wins."
          }

          Write-Host "DEBUG latest = $(Format-Semver $latestParsed)"
          Write-Host "DEBUG auto   = $(Format-Semver $autoParsed)"
          if ($fileParsed) { Write-Host "DEBUG file   = $(Format-Semver $fileParsed)" }
          else             { Write-Host "DEBUG file   = <none>" }
          Write-Host "DEBUG chosen = $(Format-Semver $chosen)"

          $tag = Format-Semver $chosen
          $nexusVersion = $tag.TrimStart('v')
          Write-Host "Tag: $tag  Nexus version: $nexusVersion"
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "NEXUS_VERSION=$nexusVersion" >> $env:GITHUB_OUTPUT

      - name: Build plugin
        shell: pwsh
        env:
          VARIANT: ${{ inputs.server_build && 'Client,Server' || 'Client' }}
          SOLUTION: ${{ inputs.solution_file }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          foreach ($variant in $env:VARIANT -split ',') {
            $config = "$variant Release"
            Write-Host "Building configuration: $config"
            msbuild "$env:SOLUTION" `
              /p:Configuration="$config" `
              /p:Platform=x64 `
              /p:PostBuildEventUseInBuild=false `
              /p:ModLoaderBuildTag="$env:TAG" `
              /p:GameSDKRoot="${{ github.workspace }}\game-sdk" `
              /p:PluginSDKInclude="${{ github.workspace }}\plugin-sdk\include" `
              /m `
              /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for $config (exit $LASTEXITCODE)" }
          }

      - name: Generate release assets
        id: assets
        shell: pwsh
        env:
          VARIANT: ${{ inputs.server_build && 'Client,Server' || 'Client' }}
          PLUGIN_NAME: ${{ inputs.plugin_name }}
          DLL_NAME: ${{ inputs.dll_name || inputs.plugin_name }}
        run: |
          $tag      = "${{ steps.tag.outputs.TAG }}"
          $repo     = "${{ github.repository }}"
          $ws       = $env:GITHUB_WORKSPACE
          $name     = $env:PLUGIN_NAME
          $dllName  = $env:DLL_NAME

          # The manifest declares [the interface version this build reports, the
          # newest one the header knows]. Its minimum is the plugin's own
          # PLUGIN_INTERFACE_VERSION, not the header's MIN: a loader older than that
          # refuses the plugin, so its auto-updater must not replace a copy that works.
          $header   = Get-Content "$ws\plugin-sdk\include\plugin_interface.h" -Raw
          $matchOwn = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION\s+(\d+)')
          $matchMax = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION_MAX\s+(\d+)')
          if (-not $matchOwn.Success) { throw "Could not find PLUGIN_INTERFACE_VERSION in plugin_interface.h" }
          if (-not $matchMax.Success) { throw "Could not find PLUGIN_INTERFACE_VERSION_MAX in plugin_interface.h" }
          $ifaceMin = [int]$matchOwn.Groups[1].Value
          $ifaceMax = [int]$matchMax.Groups[1].Value
          Write-Host "Interface version range: [$ifaceMin, $ifaceMax]"

          # Player-facing notes: one change per line in UPDATE_NOTES.txt, each line a
          # bullet on the GitHub release page. The loader draws its own bullet in the
          # Plugins Updated window, so the leading "- " is dropped here.
          $notesFile = "$ws\UPDATE_NOTES.txt"
          $noteLines = @()
          if (Test-Path $notesFile) {
            $noteLines = @(Get-Content $notesFile | ForEach-Object { ($_.Trim() -replace '^[-*](\s+|$)', '') } | Where-Object { $_ })
          }

          # The same lines are the Nexus changelog entry for this version.
          $changelog = if ($noteLines.Count -gt 0) { $noteLines -join "`n" } else { "See https://github.com/$repo/releases/tag/$tag" }
          $delim = "EOF_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog<<$delim`n$changelog`n$delim"

          $assets = @()
          foreach ($variant in $env:VARIANT -split ',') {
            $varLower = $variant.ToLower()

            # Individual DLL (the built file is named dllName, the release asset plugin_name)
            $dllSrc = "$ws\build\$variant Release\Plugins\$dllName.dll"
            Copy-Item $dllSrc "$ws\$name-$variant.dll"

            # Per-plugin update manifest
            $manifest = [ordered]@{
              plugin_name           = $name
              version               = $tag
              interface_version_min = $ifaceMin
              interface_version_max = $ifaceMax
              download_url          = "https://github.com/$repo/releases/download/$tag/$name-$variant.dll"
            }
            if ($noteLines.Count -gt 0) {
              $manifest["notes"] = $noteLines -join "`n"
            }
            $manifest | ConvertTo-Json -Depth 1 | Out-File "$ws\$name-$varLower-manifest.json" -Encoding utf8NoBOM
            Write-Host "Generated $variant manifest:"
            Get-Content "$ws\$name-$varLower-manifest.json"

            # Sidecar JSON (goes inside the ZIP alongside the DLL)
            $sidecar = [ordered]@{
              manifest_url = "https://github.com/$repo/releases/latest/download/$name-$varLower-manifest.json"
            }

            # Plugin ZIP: Plugins\Name.dll + Plugins\Name.json
            $staging = "$ws\staging-$varLower\Plugins"
            New-Item -ItemType Directory -Force $staging | Out-Null
            Copy-Item $dllSrc "$staging\$dllName.dll"
            $sidecar | ConvertTo-Json -Depth 1 | Out-File "$staging\$dllName.json" -Encoding utf8NoBOM

            $pdbSrc = [System.IO.Path]::ChangeExtension($dllSrc, ".pdb")
            if (Test-Path $pdbSrc) { Copy-Item $pdbSrc "$staging\$dllName.pdb" }

            Compress-Archive -Path "$ws\staging-$varLower\*" -DestinationPath "$ws\$name-$variant-$tag.zip"
            Write-Host "Created plugin ZIP: $name-$variant-$tag.zip"

            $assets += "$ws\$name-$variant.dll", "$ws\$name-$varLower-manifest.json", "$ws\$name-$variant-$tag.zip"
          }

          # Expose the asset list for the release step
          $delim = "EOF_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<$delim`n$($assets -join "`n")`n$delim"

      - name: Dry run, keep the release assets
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ steps.tag.outputs.TAG }}
          path: ${{ steps.assets.outputs.files }}
          if-no-files-found: error

      - name: Dry run, what would be published
        if: ${{ inputs.dry_run }}
        shell: pwsh
        env:
          FILES: ${{ steps.assets.outputs.files }}
          CHANGELOG: ${{ steps.assets.outputs.changelog }}
          NEXUS_MOD_ID: ${{ inputs.nexus_mod_id }}
        run: |
          Write-Host "Dry run: no GitHub release created and nothing uploaded to Nexus."
          Write-Host "Release ${{ steps.tag.outputs.TAG }} would carry:"
          $env:FILES -split "`n" | ForEach-Object { Write-Host "  $_" }
          if ($env:NEXUS_MOD_ID) {
            Write-Host "Nexus mod $env:NEXUS_MOD_ID would get version ${{ steps.tag.outputs.NEXUS_VERSION }} with this changelog:"
            Write-Host $env:CHANGELOG
          } else {
            Write-Host "No nexus_mod_id: the Nexus upload is skipped."
          }

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ steps.assets.outputs.files }}
          RELEASE_TITLE: ${{ inputs.release_title || inputs.plugin_name }}
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}"
          $ws  = $env:GITHUB_WORKSPACE

          $assets = @($env:FILES -split "`n" | Where-Object { $_ })

          Write-Host "Uploading $($assets.Count) asset(s):"
          $assets | ForEach-Object { Write-Host "  $_" }

          # Put UPDATE_NOTES.txt above the generated list when it exists.
          $notesArgs = @()
          $notesFile = "$ws\UPDATE_NOTES.txt"
          if ((Test-Path $notesFile) -and (Get-Content $notesFile | Where-Object { $_.Trim() })) {
            $notesArgs = @("--notes-file", $notesFile)
          }

          gh release create $tag @assets `
            --title "$env:RELEASE_TITLE $tag" `
            @notesArgs `
            --generate-notes

      - name: Upload Client build to Nexus Mods
        if: ${{ !inputs.dry_run && inputs.nexus_mod_id != '' }}
        uses: msantoro12/starrupture-release-actions/nexus-publish@nexus-publish-v1
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          mod_id: ${{ inputs.nexus_mod_id }}
          file_id: ${{ secrets.NEXUS_CLIENT_GROUP_ID }}
          filename: ${{ github.workspace }}\${{ inputs.plugin_name }}-Client-${{ steps.tag.outputs.TAG }}.zip
          display_name: "${{ inputs.nexus_display_name || inputs.plugin_name }} Client ${{ steps.tag.outputs.TAG }}"
          file_description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.TAG }}"
          version: ${{ steps.tag.outputs.NEXUS_VERSION }}
          changelog: ${{ steps.assets.outputs.changelog }}
          description_file: ${{ inputs.nexus_description_file }}
          tag: ${{ steps.tag.outputs.TAG }}

      - name: Upload Server build to Nexus Mods
        if: ${{ !inputs.dry_run && inputs.nexus_mod_id != '' && inputs.server_build }}
        uses: msantoro12/starrupture-release-actions/nexus-publish@nexus-publish-v1
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          mod_id: ${{ inputs.nexus_mod_id }}
          file_id: ${{ secrets.NEXUS_SERVER_GROUP_ID }}
          filename: ${{ github.workspace }}\${{ inputs.plugin_name }}-Server-${{ steps.tag.outputs.TAG }}.zip
          display_name: "${{ inputs.nexus_display_name || inputs.plugin_name }} Server ${{ steps.tag.outputs.TAG }}"
          file_description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.TAG }}"
          version: ${{ steps.tag.outputs.NEXUS_VERSION }}
          update_page: false
