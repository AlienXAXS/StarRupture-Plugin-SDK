# Reusable release workflow for StarRupture plugins.
#
# Usage - in your plugin repo's .github/workflows/release.yml (see templates/release.yml):
#
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: AlienXAXS/StarRupture-Plugin-SDK/.github/workflows/plugin-release.yml@<SDK release tag>
#       with:
#         plugin_name: Compass_Plugin
#         solution_file: Compass_Plugin.sln
#       secrets: inherit
#
# Inputs:
#   plugin_name            - Base name used for the manifest, ZIP and release assets.
#   solution_file          - Path to the .sln file relative to the repo root.
#   dll_name               - Name of the built DLL, when it differs from plugin_name.
#   server_build           - true to also build, package and release the Server variant
#                            (default false: Client only).
#   release_title          - Optional release title prefix (defaults to plugin_name).
#   nexus_mod_id           - Global (v3 API) id of the Nexus page. Empty (default) skips Nexus.
#                            The Client upload sets the page Version field, changelog and
#                            description; the Server upload (server_build) only adds the file.
#   nexus_display_name     - Name shown on the Nexus files (defaults to plugin_name).
#   nexus_description_file - BBCode file that replaces the Nexus page description when it exists
#                            (default nexus/description.bbcode).
#   sdk_repository, sdk_ref - Where to take the Plugin SDK headers from (default: the same
#                            commit as this workflow, so the tag or sha in "uses:" picks
#                            both). sdk_ref overrides it. Another sdk_repository needs
#                            sdk_ref too. The Game-SDK comes from that checkout's
#                            "StarRupture SDK" submodule, at the commit the checkout pins.
#   dry_run                - Build and package, upload the files as a workflow artifact, but
#                            create no GitHub release and upload nothing to Nexus.
#
# Release notes: UPDATE_NOTES.txt at the repo root, one change per line, is shown above the
# generated notes on the release page, stored as "notes" in the update manifest, and is the
# Nexus changelog entry. A missing or empty file means the entry links to the release.
#
# Interface level: the manifest's interface_version_min is the level the plugin declares, read
# from PLUGIN_NEEDS_INTERFACE in its project files (vcxproj, props, CMake or a #define). Each
# variant gets its own: a Client and a Server configuration may set different numbers. Unset,
# it is the SDK's PLUGIN_INTERFACE_BASELINE for a plugin that uses PLUGIN_DECLARED_INTERFACE,
# and the SDK's PLUGIN_INTERFACE_VERSION for a plugin that has not moved to it yet.
#
# Secrets (via "secrets: inherit", only when nexus_mod_id is set): NEXUS_APIKEY,
# NEXUS_CLIENT_GROUP_ID and, with server_build, NEXUS_SERVER_GROUP_ID.

name: Plugin Release (reusable)

on:
  workflow_call:
    inputs:
      plugin_name:
        description: 'Base plugin name (e.g. Compass_Plugin)'
        required: true
        type: string
      solution_file:
        description: 'Path to the .sln file relative to the repo root'
        required: true
        type: string
      dll_name:
        description: 'Built DLL name when it differs from plugin_name'
        required: false
        type: string
        default: ''
      server_build:
        description: 'Also build, package and release the Server variant'
        required: false
        type: boolean
        default: false
      release_title:
        description: 'Release title prefix (defaults to plugin_name)'
        required: false
        type: string
        default: ''
      nexus_mod_id:
        description: 'Global (v3 API) id of the Nexus page; empty skips the Nexus upload'
        required: false
        type: string
        default: ''
      nexus_display_name:
        description: 'Name shown on the Nexus files (defaults to plugin_name)'
        required: false
        type: string
        default: ''
      nexus_description_file:
        description: 'BBCode file that replaces the Nexus page description, if it exists'
        required: false
        type: string
        default: 'nexus/description.bbcode'
      sdk_repository:
        description: 'Repository to take the Plugin SDK headers from (empty: the repository of this workflow); needs sdk_ref when it is another one'
        required: false
        type: string
        default: ''
      sdk_ref:
        description: 'Branch, tag or sha of the Plugin SDK (empty: the commit of this workflow)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and package only: no GitHub release, no Nexus upload'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write

    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4

      # By default the headers come from the commit this file is at. The github
      # context describes the caller; job.workflow_* describes this workflow.
      - name: Resolve the Plugin SDK source
        id: sdk
        shell: pwsh
        env:
          SDK_REPOSITORY: ${{ inputs.sdk_repository }}
          SDK_REF: ${{ inputs.sdk_ref }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          $repository = if ($env:SDK_REPOSITORY) { $env:SDK_REPOSITORY } else { $env:WORKFLOW_REPOSITORY }
          if (-not $repository) {
            throw "job.workflow_repository is empty, so the Plugin SDK repository is unknown. Set sdk_repository and sdk_ref."
          }
          $ref = $env:SDK_REF
          if (-not $ref) {
            if ($repository -ne $env:WORKFLOW_REPOSITORY) {
              throw "sdk_repository is $repository, not the repository of this workflow. Set sdk_ref too."
            }
            if ($env:WORKFLOW_SHA -notmatch '^[0-9a-f]{40}$') {
              throw "job.workflow_sha is '$env:WORKFLOW_SHA', not a commit sha. Set sdk_ref."
            }
            $ref = $env:WORKFLOW_SHA
          }
          Write-Host "Plugin SDK headers: $repository at $ref"
          "repository=$repository" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Checkout Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.sdk.outputs.repository }}
          ref: ${{ steps.sdk.outputs.ref }}
          path: plugin-sdk
          submodules: true

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Parse-Semver([string]$v) {
            if ($v -match '^v?(\d+)\.(\d+)\.(\d+)$') {
              return @{
                Major = [int]$Matches[1]
                Minor = [int]$Matches[2]
                Patch = [int]$Matches[3]
              }
            }
            return $null
          }

          function Compare-Semver($a, $b) {
            if ($a.Major -lt $b.Major) { return -1 }
            if ($a.Major -gt $b.Major) { return  1 }
            if ($a.Minor -lt $b.Minor) { return -1 }
            if ($a.Minor -gt $b.Minor) { return  1 }
            if ($a.Patch -lt $b.Patch) { return -1 }
            if ($a.Patch -gt $b.Patch) { return  1 }
            return 0
          }

          function Format-Semver($v) {
            return "v$($v.Major).$($v.Minor).$($v.Patch)"
          }

          # Find the highest existing semver release tag
          $latestParsed = $null
          $releaseTags = gh release list --limit 100 --json tagName |
            ConvertFrom-Json |
            Select-Object -ExpandProperty tagName |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }

          foreach ($t in $releaseTags) {
            $parsed = Parse-Semver $t
            if ($parsed -and ($latestParsed -eq $null -or (Compare-Semver $parsed $latestParsed) -gt 0)) {
              $latestParsed = $parsed
            }
          }

          if ($latestParsed -eq $null) {
            Write-Host "No semver tags found, bootstrapping from v0.0.0"
            $latestParsed = @{ Major = 0; Minor = 0; Patch = 0 }
          } else {
            Write-Host "Latest semver tag: $(Format-Semver $latestParsed)"
          }

          # Auto-increment: bump minor, reset patch
          $autoParsed = @{
            Major = $latestParsed.Major
            Minor = $latestParsed.Minor + 1
            Patch = 0
          }

          # Optional version file override (must be strictly higher to win)
          $versionFile = Join-Path $env:GITHUB_WORKSPACE "version"
          $fileParsed = $null

          if (Test-Path $versionFile) {
            $raw = (Get-Content $versionFile -Raw).Trim()
            $fileParsed = Parse-Semver $raw
            if ($fileParsed) {
              Write-Host "version file specifies: $raw"
            } else {
              Write-Warning "version file '$raw' is not valid semver, ignoring."
            }
          }

          $chosen = $autoParsed
          if ($fileParsed -and (Compare-Semver $fileParsed $autoParsed) -gt 0) {
            $chosen = $fileParsed
            Write-Host "version file is higher, using it."
          } else {
            Write-Host "Auto-increment minor wins."
          }

          Write-Host "DEBUG latest = $(Format-Semver $latestParsed)"
          Write-Host "DEBUG auto   = $(Format-Semver $autoParsed)"
          if ($fileParsed) { Write-Host "DEBUG file   = $(Format-Semver $fileParsed)" }
          else             { Write-Host "DEBUG file   = <none>" }
          Write-Host "DEBUG chosen = $(Format-Semver $chosen)"

          $tag = Format-Semver $chosen
          $nexusVersion = $tag.TrimStart('v')
          Write-Host "Tag: $tag  Nexus version: $nexusVersion"
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "NEXUS_VERSION=$nexusVersion" >> $env:GITHUB_OUTPUT

      - name: Build plugin
        shell: pwsh
        env:
          VARIANT: ${{ inputs.server_build && 'Client,Server' || 'Client' }}
          SOLUTION: ${{ inputs.solution_file }}
          TAG: ${{ steps.tag.outputs.TAG }}
        run: |
          foreach ($variant in $env:VARIANT -split ',') {
            $config = "$variant Release"
            Write-Host "Building configuration: $config"
            msbuild "$env:SOLUTION" `
              /p:Configuration="$config" `
              /p:Platform=x64 `
              /p:PostBuildEventUseInBuild=false `
              /p:ModLoaderBuildTag="$env:TAG" `
              /p:GameSDKRoot="${{ github.workspace }}\plugin-sdk\StarRupture SDK" `
              /p:PluginSDKInclude="${{ github.workspace }}\plugin-sdk\include" `
              /m `
              /v:minimal
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for $config (exit $LASTEXITCODE)" }
          }

      - name: Generate release assets
        id: assets
        shell: pwsh
        env:
          VARIANT: ${{ inputs.server_build && 'Client,Server' || 'Client' }}
          PLUGIN_NAME: ${{ inputs.plugin_name }}
          DLL_NAME: ${{ inputs.dll_name || inputs.plugin_name }}
        run: |
          $tag      = "${{ steps.tag.outputs.TAG }}"
          $repo     = "${{ github.repository }}"
          $ws       = $env:GITHUB_WORKSPACE
          $name     = $env:PLUGIN_NAME
          $dllName  = $env:DLL_NAME

          # BEGIN plugin-interface-need
          # The interface level one variant of the plugin needs: what it sets as
          # PLUGIN_NEEDS_INTERFACE (a project-wide define in a vcxproj/props/targets file, a
          # CMake file, or a #define in its sources). An entry whose Condition names the
          # other variant is not that variant's. The filter sees only the Condition text on the
          # entry and the groups around it: a word Client or Server (a configuration such as
          # 'Server Release|x64', or '$(Configuration)'=='Server Release'). A Server-only entry
          # under any other Condition, or none, counts for the Client too. A #define has no
          # Condition, so it counts for both variants. With no entry at all, a plugin that fills PluginInfo
          # with PLUGIN_DECLARED_INTERFACE needs the header's PLUGIN_INTERFACE_BASELINE, and
          # an older plugin that still uses PLUGIN_INTERFACE_VERSION needs that number.
          function Get-PluginInterfaceNeed {
            param([string]$PluginRoot, [string]$HeaderText, [string]$Variant = 'Client')

            function Get-HeaderNumber([string]$name) {
              $m = [regex]::Match($HeaderText, "#define\s+$name\s+(\d+)")
              if ($m.Success) { [int]$m.Groups[1].Value } else { $null }
            }
            $hdrMin  = Get-HeaderNumber 'PLUGIN_INTERFACE_VERSION_MIN'
            $hdrMax  = Get-HeaderNumber 'PLUGIN_INTERFACE_VERSION_MAX'
            $hdrVer  = Get-HeaderNumber 'PLUGIN_INTERFACE_VERSION'
            $hdrBase = Get-HeaderNumber 'PLUGIN_INTERFACE_BASELINE'
            # The lowest level a plugin can declare is the header's static_assert on
            # PLUGIN_NEEDS_INTERFACE, which sits above PLUGIN_INTERFACE_VERSION_MIN.
            $floor = $hdrMin
            $mf = [regex]::Match($HeaderText, 'static_assert\(\s*PLUGIN_NEEDS_INTERFACE\s*>=\s*(\d+)')
            if ($mf.Success) { $floor = [int]$mf.Groups[1].Value }
            if ($null -eq $hdrMin) { throw "Could not find PLUGIN_INTERFACE_VERSION_MIN in plugin_interface.h" }
            if ($null -eq $hdrMax) { throw "Could not find PLUGIN_INTERFACE_VERSION_MAX in plugin_interface.h" }

            # The plugin's own files, without the SDK checkout, build output and test projects.
            $skipDirs = @('.git', 'plugin-sdk', 'StarRupture SDK', 'build', 'obj', 'node_modules', 'staging-*', 'Tests')
            $files = New-Object System.Collections.Generic.List[string]
            $stack = New-Object System.Collections.Generic.Stack[string]
            $stack.Push($PluginRoot)
            while ($stack.Count -gt 0) {
              foreach ($item in Get-ChildItem -LiteralPath $stack.Pop() -Force) {
                if ($item.PSIsContainer) {
                  $skip = $false
                  foreach ($pattern in $skipDirs) { if ($item.Name -like $pattern) { $skip = $true } }
                  if (-not $skip) { $stack.Push($item.FullName) }
                } else {
                  $files.Add($item.FullName)
                }
              }
            }

            $hits = New-Object System.Collections.Generic.List[object]
            $converted = $false
            foreach ($file in $files) {
              $rel  = $file.Substring($PluginRoot.Length).TrimStart('\', '/')
              $leaf = [System.IO.Path]::GetFileName($file)
              $ext  = [System.IO.Path]::GetExtension($file).ToLowerInvariant()

              if ($ext -in '.vcxproj', '.props', '.targets') {
                $text = [System.IO.File]::ReadAllText($file)
                if ($text -notmatch 'PLUGIN_NEEDS_INTERFACE') { continue }
                try { $xml = [xml]$text } catch { throw "Could not read $rel as XML: $($_.Exception.Message)" }
                $found = 0
                foreach ($el in $xml.GetElementsByTagName('PreprocessorDefinitions')) {
                  # A Condition on the entry or on any group around it names the configuration.
                  $cond = ''
                  for ($n = $el; $n -is [System.Xml.XmlElement]; $n = $n.ParentNode) { $cond += ' ' + $n.GetAttribute('Condition') }
                  $cfg = if ($cond -match 'Debug' -and $cond -notmatch 'Release') { 'Debug' } else { 'Release' }
                  $label = if ($cond -match "==\s*'([^']+)'") { "$rel [$($Matches[1])]" } else { $rel }
                  $cond = $cond.Trim()
                  foreach ($token in ($el.InnerText -split ';')) {
                    if ($token.Trim() -match '^PLUGIN_NEEDS_INTERFACE(=(.*))?$') {
                      $value = if ($Matches.ContainsKey(2)) { $Matches[2].Trim() } else { '' }
                      $hits.Add([pscustomobject]@{ Where = $label; Cfg = $cfg; Cond = $cond; Value = $value })
                      $found++
                    }
                  }
                }
                if ($found -eq 0) {
                  $visible = ($xml.SelectNodes('//text()') | ForEach-Object { $_.Value }) -join ' '
                  if ($visible -match 'PLUGIN_NEEDS_INTERFACE') {
                    throw "$rel mentions PLUGIN_NEEDS_INTERFACE outside a PreprocessorDefinitions entry. Set it there, as PLUGIN_NEEDS_INTERFACE=<number>."
                  }
                }
              }
              elseif ($leaf -eq 'CMakeLists.txt' -or $ext -eq '.cmake') {
                $text = [regex]::Replace([System.IO.File]::ReadAllText($file), '(?m)#.*$', '')
                foreach ($m in [regex]::Matches($text, '(?<![A-Za-z0-9_])PLUGIN_NEEDS_INTERFACE(?![A-Za-z0-9_])(=([^\s\)"'';]*))?')) {
                  $hits.Add([pscustomobject]@{ Where = $rel; Cfg = 'Release'; Cond = ''; Value = $m.Groups[2].Value })
                }
              }
              elseif (($ext -in '.h', '.hpp', '.hxx', '.inl', '.c', '.cc', '.cpp', '.cxx') -and $leaf -ne 'plugin_interface.h') {
                $text = [System.IO.File]::ReadAllText($file)
                if ($text -notmatch 'PLUGIN_NEEDS_INTERFACE|PLUGIN_DECLARED_INTERFACE') { continue }
                $text = [regex]::Replace($text, '(?s)/\*.*?\*/|//[^\r\n]*', '')
                if ($text -match '\bPLUGIN_DECLARED_INTERFACE\b') { $converted = $true }
                foreach ($m in [regex]::Matches($text, '(?m)^[ \t]*#[ \t]*define[ \t]+PLUGIN_NEEDS_INTERFACE\b[ \t]*(\S*)')) {
                  $hits.Add([pscustomobject]@{ Where = $rel; Cfg = 'Release'; Cond = ''; Value = $m.Groups[1].Value })
                }
              }
            }

            foreach ($hit in $hits) {
              if ($hit.Value -notmatch '^\d{1,4}$') {
                throw "PLUGIN_NEEDS_INTERFACE in $($hit.Where) is '$($hit.Value)'. Write it as a plain whole number, for example PLUGIN_NEEDS_INTERFACE=77."
              }
            }
            # An entry counts for this variant when its Condition names it, or names neither
            # variant. Only the Release value ships. A Debug-only value is reported, not used.
            function Test-NamesVariant([string]$cond, [string]$v) { $cond -match "(?<![A-Za-z])$v(?![A-Za-z])" }
            $hits = @($hits | Where-Object {
              (Test-NamesVariant $_.Cond $Variant) -or -not ((Test-NamesVariant $_.Cond 'Client') -or (Test-NamesVariant $_.Cond 'Server'))
            })
            $release = @($hits | Where-Object { $_.Cfg -eq 'Release' })
            $debug   = @($hits | Where-Object { $_.Cfg -eq 'Debug' })
            if (@($release | ForEach-Object { [int]$_.Value } | Select-Object -Unique).Count -gt 1) {
              $list = ($release | ForEach-Object { "$($_.Where) = $($_.Value)" }) -join '; '
              throw "PLUGIN_NEEDS_INTERFACE differs between configurations or files ($list). The $Variant Release build must set one number. To give the Client and the Server different numbers, set PLUGIN_NEEDS_INTERFACE in the project's PreprocessorDefinitions under a Condition naming Client or Server, not with #define."
            }
            foreach ($hit in $debug) {
              if ($release.Count -eq 0 -or [int]$hit.Value -ne [int]$release[0].Value) {
                Write-Host "::warning::PLUGIN_NEEDS_INTERFACE=$($hit.Value) in $($hit.Where) applies to Debug only and is not used for the manifest."
              }
            }

            if ($release.Count -gt 0) {
              if (-not $converted) {
                throw "PLUGIN_NEEDS_INTERFACE is set but no source file fills PluginInfo with PLUGIN_DECLARED_INTERFACE, so the plugin still reports the SDK's own level. Use PLUGIN_DECLARED_INTERFACE for interfaceVersion."
              }
              $need = [int]$release[0].Value
              Write-Host "$Variant plugin declares PLUGIN_NEEDS_INTERFACE=$need ($($release[0].Where))."
            }
            elseif ($converted) {
              if ($null -eq $hdrBase) { throw "The plugin uses PLUGIN_DECLARED_INTERFACE but plugin_interface.h has no PLUGIN_INTERFACE_BASELINE. Use a newer sdk_ref." }
              $need = $hdrBase
              Write-Host "PLUGIN_NEEDS_INTERFACE not set: using the baseline $need."
            }
            else {
              if ($null -eq $hdrVer) { throw "Could not find PLUGIN_INTERFACE_VERSION in plugin_interface.h" }
              $need = $hdrVer
              Write-Host "Plugin does not use PLUGIN_DECLARED_INTERFACE: using PLUGIN_INTERFACE_VERSION $need."
            }
            if ($need -lt $floor -or $need -gt $hdrMax) {
              throw "The plugin needs interface $need, outside the $floor to $hdrMax this SDK supports. Set PLUGIN_NEEDS_INTERFACE to a number in that range."
            }
            return $need
          }
          # END plugin-interface-need

          # Each manifest declares [the interface level that variant needs, the newest one
          # the header knows]. A loader older than the minimum refuses the plugin, so
          # its auto-updater must not replace a copy that works.
          $header   = Get-Content "$ws\plugin-sdk\include\plugin_interface.h" -Raw
          $matchMax = [regex]::Match($header, '#define\s+PLUGIN_INTERFACE_VERSION_MAX\s+(\d+)')
          if (-not $matchMax.Success) { throw "Could not find PLUGIN_INTERFACE_VERSION_MAX in plugin_interface.h" }
          $ifaceMax = [int]$matchMax.Groups[1].Value

          # Player-facing notes: one change per line in UPDATE_NOTES.txt, each line a
          # bullet on the GitHub release page. The loader draws its own bullet in the
          # Plugins Updated window, so the leading "- " is dropped here.
          $notesFile = "$ws\UPDATE_NOTES.txt"
          $noteLines = @()
          if (Test-Path $notesFile) {
            $noteLines = @(Get-Content $notesFile | ForEach-Object { ($_.Trim() -replace '^[-*](\s+|$)', '') } | Where-Object { $_ })
          }

          # The same lines are the Nexus changelog entry for this version.
          $changelog = if ($noteLines.Count -gt 0) { $noteLines -join "`n" } else { "See https://github.com/$repo/releases/tag/$tag" }
          $delim = "EOF_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog<<$delim`n$changelog`n$delim"

          $assets = @()
          foreach ($variant in $env:VARIANT -split ',') {
            $varLower = $variant.ToLower()
            $ifaceMin = Get-PluginInterfaceNeed -PluginRoot $ws -HeaderText $header -Variant $variant
            Write-Host "$variant interface version range: [$ifaceMin, $ifaceMax]"

            # Individual DLL (the built file is named dllName, the release asset plugin_name)
            $dllSrc = "$ws\build\$variant Release\Plugins\$dllName.dll"
            Copy-Item $dllSrc "$ws\$name-$variant.dll"

            # Per-plugin update manifest
            $manifest = [ordered]@{
              plugin_name           = $name
              version               = $tag
              interface_version_min = $ifaceMin
              interface_version_max = $ifaceMax
              download_url          = "https://github.com/$repo/releases/download/$tag/$name-$variant.dll"
            }
            if ($noteLines.Count -gt 0) {
              $manifest["notes"] = $noteLines -join "`n"
            }
            $manifest | ConvertTo-Json -Depth 1 | Out-File "$ws\$name-$varLower-manifest.json" -Encoding utf8NoBOM
            Write-Host "Generated $variant manifest:"
            Get-Content "$ws\$name-$varLower-manifest.json"

            # Sidecar JSON (goes inside the ZIP alongside the DLL)
            $sidecar = [ordered]@{
              manifest_url = "https://github.com/$repo/releases/latest/download/$name-$varLower-manifest.json"
            }

            # Plugin ZIP: Plugins\Name.dll + Plugins\Name.json
            $staging = "$ws\staging-$varLower\Plugins"
            New-Item -ItemType Directory -Force $staging | Out-Null
            Copy-Item $dllSrc "$staging\$dllName.dll"
            $sidecar | ConvertTo-Json -Depth 1 | Out-File "$staging\$dllName.json" -Encoding utf8NoBOM

            $pdbSrc = [System.IO.Path]::ChangeExtension($dllSrc, ".pdb")
            if (Test-Path $pdbSrc) { Copy-Item $pdbSrc "$staging\$dllName.pdb" }

            Compress-Archive -Path "$ws\staging-$varLower\*" -DestinationPath "$ws\$name-$variant-$tag.zip"
            Write-Host "Created plugin ZIP: $name-$variant-$tag.zip"

            $assets += "$ws\$name-$variant.dll", "$ws\$name-$varLower-manifest.json", "$ws\$name-$variant-$tag.zip"
          }

          # Expose the asset list for the release step
          $delim = "EOF_" + [guid]::NewGuid().ToString('N')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "files<<$delim`n$($assets -join "`n")`n$delim"

      - name: Dry run, keep the release assets
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ steps.tag.outputs.TAG }}
          path: ${{ steps.assets.outputs.files }}
          if-no-files-found: error

      - name: Dry run, what would be published
        if: ${{ inputs.dry_run }}
        shell: pwsh
        env:
          FILES: ${{ steps.assets.outputs.files }}
          CHANGELOG: ${{ steps.assets.outputs.changelog }}
          NEXUS_MOD_ID: ${{ inputs.nexus_mod_id }}
        run: |
          Write-Host "Dry run: no GitHub release created and nothing uploaded to Nexus."
          Write-Host "Release ${{ steps.tag.outputs.TAG }} would carry:"
          $env:FILES -split "`n" | ForEach-Object { Write-Host "  $_" }
          if ($env:NEXUS_MOD_ID) {
            Write-Host "Nexus mod $env:NEXUS_MOD_ID would get version ${{ steps.tag.outputs.NEXUS_VERSION }} with this changelog:"
            Write-Host $env:CHANGELOG
          } else {
            Write-Host "No nexus_mod_id: the Nexus upload is skipped."
          }

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ steps.assets.outputs.files }}
          RELEASE_TITLE: ${{ inputs.release_title || inputs.plugin_name }}
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}"
          $ws  = $env:GITHUB_WORKSPACE

          $assets = @($env:FILES -split "`n" | Where-Object { $_ })

          Write-Host "Uploading $($assets.Count) asset(s):"
          $assets | ForEach-Object { Write-Host "  $_" }

          # Put UPDATE_NOTES.txt above the generated list when it exists.
          $notesArgs = @()
          $notesFile = "$ws\UPDATE_NOTES.txt"
          if ((Test-Path $notesFile) -and (Get-Content $notesFile | Where-Object { $_.Trim() })) {
            $notesArgs = @("--notes-file", $notesFile)
          }

          gh release create $tag @assets `
            --title "$env:RELEASE_TITLE $tag" `
            @notesArgs `
            --generate-notes

      - name: Upload Client build to Nexus Mods
        if: ${{ !inputs.dry_run && inputs.nexus_mod_id != '' }}
        uses: msantoro12/starrupture-release-actions/nexus-publish@nexus-publish-v1
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          mod_id: ${{ inputs.nexus_mod_id }}
          file_id: ${{ secrets.NEXUS_CLIENT_GROUP_ID }}
          filename: ${{ github.workspace }}\${{ inputs.plugin_name }}-Client-${{ steps.tag.outputs.TAG }}.zip
          display_name: "${{ inputs.nexus_display_name || inputs.plugin_name }} Client ${{ steps.tag.outputs.TAG }}"
          file_description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.TAG }}"
          version: ${{ steps.tag.outputs.NEXUS_VERSION }}
          changelog: ${{ steps.assets.outputs.changelog }}
          description_file: ${{ inputs.nexus_description_file }}
          tag: ${{ steps.tag.outputs.TAG }}

      - name: Upload Server build to Nexus Mods
        if: ${{ !inputs.dry_run && inputs.nexus_mod_id != '' && inputs.server_build }}
        uses: msantoro12/starrupture-release-actions/nexus-publish@nexus-publish-v1
        with:
          api_key: ${{ secrets.NEXUS_APIKEY }}
          mod_id: ${{ inputs.nexus_mod_id }}
          file_id: ${{ secrets.NEXUS_SERVER_GROUP_ID }}
          filename: ${{ github.workspace }}\${{ inputs.plugin_name }}-Server-${{ steps.tag.outputs.TAG }}.zip
          display_name: "${{ inputs.nexus_display_name || inputs.plugin_name }} Server ${{ steps.tag.outputs.TAG }}"
          file_description: "Changelog: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.TAG }}"
          version: ${{ steps.tag.outputs.NEXUS_VERSION }}
          update_page: false
